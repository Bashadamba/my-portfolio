<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Basha Damba</title>
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="top-nav">
        <a href="../index.html" class="back-button">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Home</span>
        </a>
        <button id="darkModeToggle" class="dark-mode-toggle">
            <i class="fas fa-moon"></i>
        </button>
    </nav>

    <div class="container">
        <header>
            <h1>Blog Admin</h1>
        </header>

        <form id="blogPostForm" class="post-form">
            <input type="text" id="title" class="title-input" placeholder="Title" required>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="tags">Tags</label>
                    <input type="text" id="tags" placeholder="Comma separated tags" required>
                </div>
                <div class="form-group">
                    <label for="readTime">Read Time</label>
                    <input type="number" id="readTime" class="read-time-input" placeholder="Minutes" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="excerpt">Excerpt</label>
                <textarea id="excerpt" class="excerpt-input" placeholder="Write a brief excerpt..." required></textarea>
            </div>
            
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" class="content-input" placeholder="Write your story..." required></textarea>
            </div>
            
            <div class="button-group">
                <button type="button" id="previewButton">
                    <i class="fas fa-eye"></i> Preview
                </button>
                <button type="submit">
                    <i class="fas fa-paper-plane"></i> Publish
                </button>
            </div>
        </form>

        <section class="preview-section" style="display: none;">
            <div class="preview-header">
                <h2>Preview</h2>
                <button id="closePreview" class="close-preview">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="preview" class="content-preview"></div>
        </section>

        <section class="posts-list">
            <h2>Published Posts</h2>
            <div id="publishedPosts"></div>
        </section>
    </div>

    <script src="admin.js"></script>
</body>
</html>
